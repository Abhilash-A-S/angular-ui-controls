<div
  [class.expanded]="expandInput"
  [ngClass]="{ 'required-text': !!error || (!!required && !modelValue) }"
>
  <mat-form-field appearance="outline">
    @if (label) {
      <mat-label>{{ label | translate }}</mat-label>
    }
    @if (useAbbreviationHighlight) {
      <ui-abbreviation-textarea
        [preventCopy]="preventCopyPasteCut"
        [preventCut]="preventCopyPasteCut"
        [preventPaste]="preventCopyPasteCut"
        [disabled]="disabled"
        [(ngModel)]="modelValue"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="updateChanges()"
        [maxLength]="maxLength > 0 ? maxLength : null"
        placeholder="{{ placeholder | translate }}"
        [readOnly]="readonly"
        [restrictedWords]="restrictedWords"
        [abbreviationList]="abbreviationList"
        (focusIn)="onTextAreaFocus()"
        (focusOut)="onTextAreaBlur()"
        [minRows]="expandInput ? 12 : minRows"
        [maxRows]="expandInput ? 24 : maxRows"
        [mentionConfig]="
          $any(
            abbreviationMentionConfig?.length
              ? abbreviationMentionConfig
              : abbreviationHighlightMentionList
          )
        "
        [assistantFieldId]="assistantFieldId"
      >
      </ui-abbreviation-textarea>
    } @else {
      <textarea
        matInput
        uiPreventClipboard
        uiTrimLeadingSpace
        [preventCopyPasteCut]="preventCopyPasteCut"
        tabindex="0"
        aria-multiline="true"
        [disabled]="disabled"
        [cols]="columns"
        [(ngModel)]="modelValue"
        [ngModelOptions]="{ standalone: true }"
        (ngModelChange)="updateChanges()"
        (input)="changeTextareaValue($event)"
        [attr.maxLength]="maxLength > 0 ? maxLength : null"
        (focus)="onTextAreaFocus()"
        (blur)="onTextAreaBlur()"
        cdkTextareaAutosize
        #autosize="cdkTextareaAutosize"
        [cdkAutosizeMinRows]="expandInput ? 12 : minRows"
        [cdkAutosizeMaxRows]="expandInput ? 24 : maxRows"
        placeholder="{{ placeholder | translate }}"
        [readonly]="readonly"
        [mention]="mentionsList"
        [id]="effectiveId"
        [attr.ChatGptAttr]="assistantFieldId || null"
        [mentionConfig]="mentionConfig"
        (itemSelected)="itemSelected.emit($event)"
        uiArabicInput
        [isEnabledArabicText]="enableArabicInput"
      ></textarea>
    }
  </mat-form-field>
  @if (showExpandButton) {
    <button
      type="button"
      [disabled]="disabled"
      [attr.aria-expanded]="expandInput"
      [attr.aria-controls]="effectiveId"
      (click)="expandButton()"
    >
      {{ expandInput ? 'Collapse' : 'Expand' }}
    </button>
  }
  @if (shouldShowRemainingCharacters) {
    <div class="remaining-characters" [id]="effectiveId + '-remaining'">
      {{ remainingCharacters }} / {{ maxLength }}
    </div>
  }
  @if (showCharacterCount) {
    <div class="character-count" [id]="effectiveId + '-count'">
      {{ characterCount }}
      @if (maxLength > 0) {
        / {{ maxLength }}
      }
    </div>
  }
</div>
