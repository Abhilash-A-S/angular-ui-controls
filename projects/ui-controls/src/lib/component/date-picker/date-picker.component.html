<div [ngClass]="{ 'required-text': required && !modelValue }">
  <mat-form-field appearance="outline">
    @if (label) {
      <mat-label>{{ label | translate }}</mat-label>
    }
    <input
      matInput
      [id]="effectiveId"
      [matDatepicker]="datePicker"
      [(ngModel)]="modelValue"
      [ngModelOptions]="{ standalone: true }"
      (dateChange)="handleDateChange($event)"
      (ngModelChange)="commitValue(); handleModelChange($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur($event)"
      (keyup)="onKeyUp($event)"
      (keydown)="onKeyDown($event)"
      (input)="onInput($event)"
      (change)="onChangeHandler($event)"
      [disabled]="disabled"
      placeholder="{{ placeholder | translate }}"
      [uiAutoPopulateCurrentDate]="autoPopulateDateTime"
      [min]="minDate"
      [max]="maxDate"
      [readonly]="readonly"
      [required]="required"
    />
    <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
    <mat-datepicker #datePicker [disabled]="disabled || readonly" panelClass="my-datepicker-panel">
      @if (showTodayDate) {
        <mat-datepicker-actions>
          <button type="button" (click)="todayDateSelection()">{{ todayDate }}</button>
          <button type="button" matDatepickerCancel>Cancel</button>
          <button type="button" matDatepickerApply>Apply</button>
        </mat-datepicker-actions>
      }
    </mat-datepicker>
    @if (required && errorMessage) {
      <mat-error>
        {{ errorMessage | translate }}
      </mat-error>
    }
  </mat-form-field>
</div>
