<div class="ui-switch-holder" [ngClass]="size">
  <div class="ui-tab-container">
    <div class="tab-active-bg" [style.left.px]="activeOffset" [style.width.px]="activeWidth"></div>
    @for (option of options; track $index) {
      <button
        #btn
        type="button"
        class="ui-tab-btn"
        [class.active]="currentValue === option.value"
        (click)="select(option.value)"
        [disabled]="disabled || option.disabled || option.disable"
        [attr.aria-pressed]="currentValue === option.value"
      >
        {{ option.label }}
      </button>
    }
  </div>
</div>
