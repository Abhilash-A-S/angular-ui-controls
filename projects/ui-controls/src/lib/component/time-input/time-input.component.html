<div class="d-flex gap-2 align-items-center" (focusout)="setZeroBefore()">
  <mat-form-field
    class="timePicker"
    [ngClass]="{ 'mandatory-bg-color': required }"
  >
    <mat-label>Hours</mat-label>
    <input
      matInput
      type="number"
      min="0"
      max="23"
      [(ngModel)]="hours"
      [ngModelOptions]="{ standalone: true }"
      (keypress)="acceptNumberOnly($event)"
      uiDigitLimit="2"
      (keyup)="onKeyUp($event, 23, 'hours')"
      
      [id]="effectiveIdHr"
      uiPreventClipboard [preventCopyPasteCut]="preventCopyPasteCut"
      [disabled]="disabled"
      (ngModelChange)="modelValueChange($event)"
      (input)="inputChange($event)"
      (focus)="focusChange($event)"
      (blur)="blurChange($event)"
      [readonly]="readonly"
      (keydown)="keydownHandle($event)"
      (keyup.enter)="keyEnterHandle($event)"
    />
  </mat-form-field>
  <span>:</span>
  <mat-form-field
    class="timePicker"
    [ngClass]="{ 'mandatory-bg-color': required }"
  >
    <mat-label>Minutes</mat-label>
    <input
      matInput
      type="number"
      min="0"
      max="59"
      [(ngModel)]="minutes"
      [ngModelOptions]="{ standalone: true }"
      (keypress)="acceptNumberOnly($event)"
      uiDigitLimit="2"
      (focusout)="setZeroBefore()"
      (keyup)="onKeyUp($event, 59, 'minutes')"
      
      [id]="effectiveIdMin"
      uiPreventClipboard [preventCopyPasteCut]="preventCopyPasteCut"
      [disabled]="disabled"
      (ngModelChange)="modelValueChange($event)"
      (input)="inputChange($event)"
      (focus)="focusChange($event)"
      (blur)="blurChange($event)"
      [readonly]="readonly"
      (keydown)="keydownHandle($event)"
      (keyup.enter)="keyEnterHandle($event)"
    />
  </mat-form-field>
</div>
