<div [ngClass]="{ 'required-text': required && !modelValue }">
  <mat-form-field appearance="outline" class="no-margin h-100">
    @if (label) {
      <mat-label>{{ label | translate }}</mat-label>
    }
    <input
      [id]="effectiveId"
      [type]="showPassword ? 'text' : 'password'"
      matInput
      uiArabicInput
      [isEnabledArabicText]="enableArabicInput"
      uiPreventClipboard
      [preventCopyPasteCut]="preventCopyPasteCut"
      [disabled]="disabled"
      [(ngModel)]="modelValue"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="commitValue(); modelValueChange($event)"
      (input)="inputChange($event)"
      (focus)="focusChange($event)"
      (blur)="blurChange($event)"
      placeholder="{{ placeholder | translate }}"
      [readonly]="readonly"
      (keydown)="keydownHandle($event)"
      (keyup)="keyupHandle($event)"
      (keyup.enter)="keyEnterHandle($event)"
      [required]="required"
    />
    <button
      type="button"
      mat-icon-button
      [disabled]="disabled"
      [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
      [attr.aria-pressed]="showPassword"
      matSuffix
      (click)="showPassword = !showPassword"
    >
      <mat-icon
        [svgIcon]="showPassword ? 'ui:visible' : 'ui:hidden'"
        aria-hidden="false"
      ></mat-icon>
    </button>
    @if (required && errorMessage) {
      <mat-error>
        {{ errorMessage | translate }}
      </mat-error>
    }
  </mat-form-field>
</div>
