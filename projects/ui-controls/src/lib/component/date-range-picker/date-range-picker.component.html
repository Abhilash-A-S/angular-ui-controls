<div
  [ngClass]="{
    'required-text': required && !(startModelValue && endModelValue)
  }"
>
  <mat-form-field appearance="outline">
    @if(label){
    <mat-label>{{ label | translate }}</mat-label>
    }
    <mat-date-range-input [rangePicker]="dateRangePicker">
      <input
        matStartDate
        [id]="effectiveIdFrom"
        placeholder="{{ startPlaceholder | translate }}"
        [(ngModel)]="startModelValue"
        [ngModelOptions]="{ standalone: true }"
        [uiAutoPopulateCurrentDate]="autoPopulateDateTime"
        [min]="startMinDate"
        [max]="startMaxDate"
        [readonly]="startReadonly"
        [disabled]="startDisabled"
        (dateChange)="handleDateChange($event, 'START_DATE')"
        (ngModelChange)="handleModelChange($event, 'START_DATE')"
        (focus)="onFocus($event, 'START_DATE')"
        (blur)="onBlur($event, 'START_DATE')"
        (keyup)="onKeyUp($event, 'START_DATE')"
        (keydown)="onKeyDown($event, 'START_DATE')"
        (input)="onInput($event, 'START_DATE')"
        (change)="onChangeHandler($event, 'START_DATE')"
        [required]="required"
      />
      <input
        matEndDate
        [id]="effectiveIdTo"
        placeholder="{{ endPlaceholder | translate }}"
        [(ngModel)]="endModelValue"
        [ngModelOptions]="{ standalone: true }"
        [uiAutoPopulateCurrentDate]="autoPopulateDateTime"
        [min]="endMinDate"
        [max]="endMaxDate"
        [readonly]="endReadonly"
        [disabled]="endDisabled"
        (dateChange)="handleDateChange($event, 'END_DATE')"
        (ngModelChange)="handleModelChange($event, 'END_DATE')"
        (focus)="onFocus($event, 'END_DATE')"
        (blur)="onBlur($event, 'END_DATE')"
        (keyup)="onKeyUp($event, 'END_DATE')"
        (keydown)="onKeyDown($event, 'END_DATE')"
        (input)="onInput($event, 'END_DATE')"
        (change)="onChangeHandler($event, 'END_DATE')"
      />
    </mat-date-range-input>
    <mat-datepicker-toggle
      matSuffix
      [for]="dateRangePicker"
    ></mat-datepicker-toggle>
    <mat-date-range-picker #dateRangePicker></mat-date-range-picker>
    @if(required && errorMessage){
    <mat-error>
      {{ errorMessage | translate }}
    </mat-error>
    }
  </mat-form-field>
</div>
