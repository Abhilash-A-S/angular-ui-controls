<div [ngClass]="{ 'required-text': required && !modelValue }">
  <mat-form-field appearance="outline">
    @if (label) {
      <mat-label>{{ label | translate }}</mat-label>
    }
    @if (enablePrefix) {
      <span matTextPrefix>{{ prefix }}&nbsp;</span>
    }
    <input
      [id]="effectiveId"
      [attr.ChatGptAttr]="assistantFieldId || null"
      type="text"
      matInput
      uiInputRules
      uiTrimLeadingSpace
      inputType="text"
      uiArabicInput
      uiPreventClipboard
      [preventCopyPasteCut]="preventCopyPasteCut"
      [isEnabledArabicText]="enableArabicInput"
      [disabled]="disabled"
      [(ngModel)]="modelValue"
      [ngModelOptions]="{ standalone: true }"
      [onlyAlphabets]="onlyAlphabets"
      (ngModelChange)="commitValue(); modelValueChange($event)"
      (input)="inputChange($event)"
      [attr.maxlength]="maxLength > 0 ? maxLength : wordsLimit > 0 ? wordsLimit : null"
      aria-required="true"
      (focus)="focusChange($event)"
      (blur)="blurChange($event)"
      placeholder="{{ placeholder | translate }}"
      [readonly]="readonly"
      (keydown)="keydownHandle($event)"
      (keyup)="keyupHandle($event)"
      (keyup.enter)="keyEnterHandle($event)"
      (click)="inputClick($event)"
      [required]="required"
      [matTooltip]="showTooltip ? modelValue : ''"
    />
    @if (enablePostfix) {
      <span matTextSuffix>&nbsp;{{ suffix }}</span>
    }
    @if (required && errorMessage) {
      <mat-error>
        {{ errorMessage | translate }}
      </mat-error>
    }
  </mat-form-field>
</div>
