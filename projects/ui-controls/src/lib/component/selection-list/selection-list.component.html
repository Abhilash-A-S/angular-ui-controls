<div
  class="w-100 selection-list-wrapper"
  [ngClass]="{
    'required-text': required && (!inputModelValue || (multiple && inputModelValue.length === 0)),
  }"
>
  @if (label) {
    <div class="selection-list-label mb-2">
      <mat-label [matTooltip]="tooltip | translate">{{ label | translate }}</mat-label>
    </div>
  }

  <mat-selection-list
    [id]="effectiveId"
    [multiple]="multiple"
    [disabled]="disabled"
    [(ngModel)]="inputModelValue"
    (ngModelChange)="commitValue()"
    [ngModelOptions]="{ standalone: true }"
    (selectionChange)="selectionChanged($event)"
  >
    @for (item of options; track trackByFn($index, item)) {
      <mat-list-option
        [value]="valueKey ? item[valueKey] : item"
        [disabled]="item?.disabled || item?.isDisabled"
      >
        {{ labelKey ? item[labelKey] : item }}
      </mat-list-option>
    }
  </mat-selection-list>

  @if (required && errorMessage) {
    <div class="error-message mt-1 text-danger fs-7">
      {{ errorMessage | translate }}
    </div>
  }
</div>
