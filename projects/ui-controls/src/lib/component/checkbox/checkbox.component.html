<div [ngClass]="{ 'required-text': required && !modelValue }">
  <mat-checkbox
    [matTooltip]="tooltip | translate"
    [disabled]="disabled"
    [(ngModel)]="inputModelValue"
    [ngModelOptions]="{ standalone: true }"
    (ngModelChange)="commitValue(); modelValueChange()"
    [id]="effectiveId"
    [indeterminate]="indeterminate"
    (change)="onChangeHandle($event, 'change')"
    (input)="inputChange($event, 'input')"
    (click)="onCheckboxClick($event)"
  >
    @if (label) {
      <mat-label>{{ label | translate }}</mat-label>
    }
  </mat-checkbox>
  @if (required && errorMessage) {
    <div>
      {{ errorMessage | translate }}
    </div>
  }
</div>
